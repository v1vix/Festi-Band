<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repertorio Oficial | Festi-Band</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="repertorio-body">

    <nav class="navbar">
        <div class="logo">FESTI<span>BAND</span></div>
        <div class="nav-links">
            <a href="admin.html" id="btn-volver-admin" class="btn-edit" style="display: none;">⚙️ Administrar</a>
            <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
        </div>
    </nav>

    <main class="repertorio-container">
        <header class="repertorio-header">
            <h1>Repertorio <span class="gold-text">Oficial</span></h1>
            <div class="search-box">
                <input type="text" id="search-repertorio" placeholder="🔍 Buscar por obra, autor o instrumento...">
            </div>
        </header>

        <div class="repertorio-grid">
            <div class="pieza-card" onclick="abrirDetalle('himno')">
                <div class="video-preview-img" style="background-image: url('https://images.unsplash.com/photo-1511192336575-5a79af67a629?q=80');">
                    <div class="play-overlay">▶ Ver Detalles</div>
                </div>
                <div class="pieza-content">
                    <h3>Himno Festi-Band</h3>
                    <p>Arreglo para banda sinfónica completa. Nivel Grado 4.</p>
                </div>
            </div>

            <div class="pieza-card" onclick="abrirDetalle('merengue')">
                <div class="video-preview-img" style="background-image: url('https://images.unsplash.com/photo-1514320298324-a4a27a19baa9?q=80');">
                    <div class="play-overlay">▶ Ver Detalles</div>
                </div>
                <div class="pieza-content">
                    <h3>Merengue No. 1</h3>
                    <p>Adaptación folclórica para ensamble de maderas y metales.</p>
                </div>
            </div>
        </div>
    </main>

    <div id="modal-detalle" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarDetalle()">&times;</span>
            <div id="detalle-dinamico">
                </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

<script src="script.js"></script>
</body>

</html>
