<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Administrativo | Festi-Band</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body class="admin-body">
    <nav class="navbar">
        <div class="logo">FESTI<span>BAND</span> ADMIN</div>
        <a href="repertorio.html" class="btn-logout">Ver Repertorio</a>
    </nav>

    <main class="admin-container">
        <section class="admin-card">
            <h2>Gestionar Pieza Musical</h2>
            <form id="form-pieza">
                <input type="hidden" id="edit-id">
                <div class="input-grou2">
                    <input type="text" id="admin-titulo" placeholder="Título de la obra" required>
                    <input type="text" id="admin-grado" placeholder="Grado (Ej: Grade 4)" required>
                </div>
                <div class="input-grou2">
                    <input type="text" id="admin-duracion" placeholder="Compositor / Arreglista" required>
                    <input type="text" id="admin-yt" placeholder="ID de YouTube (Ej: dQw4w9WgXcQ)" required>
                </div>
                <div class="inputboxad">
                    <input type="text" id="admin-img" placeholder="URL de la imagen de portada">
                </div>
                <div class="input-desc">
                    <textarea id="admin-desc" placeholder="Descripción de la obra" rows="6"></textarea>
                </div>
                <div class="input-pdf-upload">
                <label style="color: white; display: block; margin-bottom: 5px; font-size: 0.9rem;">Subir Partitura (PDF):</label>
                <input type="file" id="pdf-file" accept=".pdf" style="color: white; margin-bottom: 15px;">
                </div>
                <button type="submit" class="btn-primary">Guardar Pieza</button>
            </form>
        </section>

        <section class="admin-list">
            <h3>Piezas Actuales</h3>
            <div id="tabla-piezas">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
